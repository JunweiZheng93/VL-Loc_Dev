name: mapillary_pano_mixed
scenes:
  - MGL_final/MountVernon
  - MGL_rainy/MountVernon
  - MGL_night/MountVernon  
  - MGL_foggy/MountVernon
  - MGL_snowy/MountVernon
  - MGL_over_exposure/MountVernon
  - MGL_under_exposure/MountVernon  
  - MGL_motion_blur/MountVernon

split: splits_MGL_MountVernon_mixed.json
loading:
  train:
    batch_size: 24
    num_workers: ${.batch_size}
  val:
    batch_size: ${..train.batch_size}
    num_workers: ${.batch_size}
# map data
num_classes:
  areas: 7
  ways: 10
  nodes: 33
pixel_per_meter: 2
crop_size_meters: 64
max_init_error: 48
add_map_mask: true
# preprocessing
resize_image: 512
pad_to_square: true
rectify_pitch: true
augmentation:
  rot90: true
  flip: true
  image: {apply: true}
