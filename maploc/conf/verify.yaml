# TextVerify · RHO + 假设级文本验证(设计 C,spec docs/superpowers/specs/2026-11-07-language-verified-hypotheses-design.md)
# 图像分支照旧算后验并取前 K 个峰;文本验证器读 view1 的 caption,预测各方位扇区 × 距离段的 OSM 面状地物比例,
# 与每个峰处的 OSM 比例比相似度来给候选打分;后验按盆地重排(盆地内保留图像形状,盆地间由验证器决定)。
# 协议:与 RHO 基线完全相同的从零训练(rho.yaml),只有 T5 冻结;验证器参数用 training.lr_text。
# 各项取值来自 docs/research-topk-prelim.md(top-k 上限预实验)。
# 启动:python -m maploc.train --config-name=verify data=<场景> experiment.name=TextVerify_RHO_<场景>
# 评测:python -m maploc.evaluation.eval_rho --experiment TextVerify_RHO_<场景> --scene <场景> \
#         model.name=orienternet_verify data.captions=true model.num_rotations=256 [--sequential]
defaults:
  - rho
  - _self_

model:
  name: orienternet_verify
  verify:
    K: 10                  # 训练期候选峰数:前 10 个峰覆盖 64% / 87% 的真值(neuanspach / washington)
    K_eval: 10             # 评测期候选峰数(评测时可改 20)
    nms_xy: 5.0            # 非极大值抑制半径(m),也是 listwise 目标的距离阈值
    nms_yaw: 20.0          # 非极大值抑制的旋转半径(°),也是 listwise 目标的角度阈值
    sectors: 5             # 方位扇区数(120° 视锥内)
    ranges: 3              # 距离段数(按到相机的距离 / 32 m 分段;视锥按 z ≤ 32 m 截断,外侧扇区的最远段可到 60 m)
    coarse_cell: 2.0       # 描述子采样网格(m)
    fov_deg: 120.0
    encoder: t5-base       # 冻结的文本编码器
    max_tokens: 64
    d_model: 256           # 区域查询验证器:2 层交叉注意力(无自注意力)
    layers: 2
    heads: 8
    ffn: 512
    tau_init: 10.0         # 候选分数的温度初值(可学习)
    learn_beta: true       # 是否学习图像项 beta(初值 0,只经 listwise 损失学习;消融 false)
    alpha_d: 1.0           # 描述子回归 CE 权重(稠密,每个样本都有)
    alpha_l: 1.0           # 候选 listwise CE 权重(只有它训练 tau / beta / 区域权重)
    blank_captions: false  # true = 空 caption 对照(w/o text)

data:
  captions: true

training:
  lr_text: 1e-4            # 验证器(verifier / log_tau / beta / region_logits)的学习率;基座沿用 rho 的 1e-5
  # 学习率调度与 checkpoint 选择只看图像 NLL(基线看的就是它:基线的 total == nll),
  # 否则 desc_ce / listwise 会改变图像分支的降学习率时机和被评测的 epoch,"图像分支与基线一致"就不成立
  lr_scheduler:
    monitor: loss/nll/val
  checkpointing:
    monitor: loss/nll/val
